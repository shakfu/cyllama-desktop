[project]
name = "cyllama-sidecar"
version = "0.1.0"
description = "FastAPI sidecar that exposes cyllama over localhost HTTP/SSE"
requires-python = ">=3.12"
dependencies = [
  # 0.4.2 is what scripts/build-python-env.sh bundles; the floor also
  # matches cyllama's own cp312-abi3 wheel tag.
  "cyllama>=0.4.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # Required for FastAPI multipart parsing (POST /chat/upload).
  "python-multipart>=0.0.9",
  "openai>=1.50",
  "anthropic>=0.40",
  # Document attachment in composer (TODO Multimodal #1). pypdf is the
  # MIT-licensed v1 PDF backend -- first in cyllama's auto-priority
  # order, pure Python, small. Richer extraction (docling for OCR /
  # tables / images) is opt-in by the user via a future Settings action.
  "pypdf>=4.0",
  # Whisper transcription (Transcribe pane + composer mic). cyllama's
  # ``cyllama.whisper.cli.load_wav_file`` returns numpy arrays of audio
  # samples, so without numpy the load_wav probe fails and
  # /info.features.whisper is reported as False -- which silently hides
  # the Transcribe pane and the composer mic button. Pinned >=1.26 to
  # match cyllama's expectations.
  "numpy>=1.26",
]
