[project]
name = "cyllama-sidecar"
version = "0.1.0"
description = "FastAPI sidecar that exposes cyllama over localhost HTTP/SSE"
requires-python = ">=3.11"
dependencies = [
  "cyllama",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # Required for FastAPI multipart parsing (POST /chat/upload).
  "python-multipart>=0.0.9",
  "openai>=1.50",
  "anthropic>=0.40",
]
