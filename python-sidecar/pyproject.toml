[project]
name = "cyllama-sidecar"
version = "0.1.0"
description = "FastAPI sidecar that exposes cyllama over localhost HTTP/SSE"
requires-python = ">=3.12"
dependencies = [
  # Floor: the oldest cyllama the sidecar is verified against.
  # scripts/build-python-env.sh pins the exact version it bundles.
  "cyllama>=0.4.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # Required for FastAPI multipart parsing (POST /chat/upload).
  "python-multipart>=0.0.9",
  "openai>=1.50",
  "anthropic>=0.40",
  # Document attachment in composer (TODO Multimodal #1). pypdf is the
  # MIT-licensed v1 PDF backend -- first in cyllama's auto-priority
  # order, pure Python, small. Richer extraction (docling for OCR /
  # tables / images) is opt-in by the user via a future Settings action.
  "pypdf>=4.0",
]

# Three top-level modules live here: the sidecar, the external-provider
# client layer it imports, and the client library its child scripts import.
# Without this, setuptools' flat-layout auto-discovery refuses to build
# ("Multiple top-level modules discovered"), which breaks the bundled-env
# rebuild and CI.
[tool.setuptools]
py-modules = ["sidecar", "providers", "cyllama_desktop"]
